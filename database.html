<!DOCTYPE html>
<html lang="en">

  <head>
    
    <!-- GoatCounter: cookieless visit counts (https://minsight.goatcounter.com) -->
    <script data-goatcounter="https://minsight.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>

    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48.png">
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">

    <title>MinSight - Rapid spectroscopy data fitting and interpretation</title>

    <!-- <link rel="stylesheet" type="text/css" href="css/dropdown.css"> -->
    <link rel="preload" href="fonts/source-sans-3-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/source-serif-4-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" type="text/css" href="css/db.css">
    <link rel="stylesheet" type="text/css" href="css/nav.css">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8" />

  </head>

<body class="search-centered">

  <div id="nav-placeholder"></div>

  <!-- <div id="navbar"></div> <script> fetch("navbar.html") .then(response => response.text()) .then(data => { document.getElementById("navbar").innerHTML = data; }); </script> -->
  
  <div id="search-wrapper">
    
    <div id="search-block">

      <h1 class="db-title">Explore the MinSight database</h1>
      <p class="db-subtitle">
        Find published Mössbauer hyperfine parameters and see their corresponding spectra.
      </p>

      <!-- Search bar -->
      <div class="search-row">

        <div class="search-container">
          <input
            id="search"
            type="text"
            placeholder="Search Fe-bearing phase (e.g. Goethite, Magnetite...)"
            autocomplete="off">
          </input>
          <button id="clear-btn" title="Clear search">✕</button>
          <button id="search-btn" title="Search">🔍︎</button>

          <div id="autocomplete"></div>
        </div>

      <!-- Filters header: button + chips -->
      <div class="filters-header">
        <button
          id="toggle-filters"
          class="filters-toggle hyperfine-toggle" aria-label="Filter by hyperfine parameters"
          title="Filter by hyperfine parameters">    
          <!-- <span class="hf-symbol"><sub>δ</sub>Δ<sub>B</sub></span> -->
          <span class="hf-symbol">Filter</span>

        </button>
        
        
      </div>


      </div>
      <!-- Collapsible filters panel (ALL fields INSIDE) -->
      <div id="filters-panel" class="filters-panel">

        <div class="filter-row">
          <label>Temp [K]</label>
          <input id="temp-min" type="number" placeholder="min" inputmode="decimal">
          <span>–</span>
          <input id="temp-max" type="number" placeholder="max" inputmode="decimal">
        </div>

        <div class="filter-row">
          <label>IS [mm/s]</label>
          <input id="is-min" type="number" step="0.01" placeholder="min" inputmode="decimal">
          <span>–</span>
          <input id="is-max" type="number" step="0.01" placeholder="max" inputmode="decimal">
        </div>

        <div class="filter-row">
          <label>QS [mm/s]</label>
          <input id="qs-min" type="number" step="0.01" placeholder="min" inputmode="decimal">
          <span>–</span>
          <input id="qs-max" type="number" step="0.01" placeholder="max" inputmode="decimal">
        </div>

        <div class="filter-row">
          <label>Bhf [T]</label>
          <input id="bhf-min" type="number" step="0.1" placeholder="min" inputmode="decimal">
          <span>–</span>
          <input id="bhf-max" type="number" step="0.1" placeholder="max" inputmode="decimal">
        </div>

        <!-- <div class="filter-actions">
          <button id="clear-filters">Clear filters</button>
        </div> -->

      </div>

      <!-- Messages -->
      <!-- <p id="result-count"></p> -->
      
      <!-- <p id="no-results">No results found.</p> -->

    </div>  
  </div>

  
<!-- ✅ RESULTS MUST LIVE OUTSIDE -->
<div id="results-wrapper">

  <div id="active-filters" class="active-filters"></div>

  <div id="mineral-highlight"></div>

  <span id="result-count" class="result-count"></span>
  <p id="no-results">No results found.</p>

  <div id="results-cards"></div>
  <table id="results"></table>
</div>

</body>
</html>
